<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Weather App</title>
</head>
<body>
    <main class="container">
        <div id="searchBar">
            <input type="text" name="" id="inputCity">
            <img src="./img/lupa.png" alt="lupa" id="lupa">
        </div>
        <div id="main_content">
            <h3 id="date"></h3>
            <h1 id="titleCity">LONDON</h1>
            <img src="./img/cloud.png" alt="clouds">
            <p id="clima">Clouds</p>
            <h2 id="temperatura">13°C</h2>
        </div>
        <div id="more_info">
            <span id="highs">
                <h3>Highs</h3>
                <p>14.44°C</p>
            </span>
            <span id="lows">
                <h3>Lows</h3>
                <p>11.49°C</p>
            </span>
        </div>
    </main>
</body>
</html>
